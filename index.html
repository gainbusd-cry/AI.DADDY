<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI.DADDY - AI Advertisement Generator</title>
    <!-- Tailwind CSS for modern look -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen">

    <!-- Header / Navbar -->
    <header class="border-b border-gray-800 bg-gray-950 p-4 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold tracking-wider text-purple-400">AI.DADDY <span class="text-sm font-normal text-gray-400">MVP</span></h1>
            <div class="bg-gray-800 px-4 py-1.5 rounded-full text-sm font-semibold border border-purple-500/30">
                ⚡ Balance: <span class="text-purple-400">50 Credits</span>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto px-4 py-10 grid grid-cols-1 md:grid-cols-2 gap-8">
        
        <!-- Left Side: Input Form -->
        <div class="bg-gray-950 p-6 rounded-2xl border border-gray-800 shadow-xl h-fit">
            <h2 class="text-xl font-bold mb-6 text-purple-300">📢 Generate High-Converting Ads</h2>
            
            <form id="adForm" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-gray-400 mb-1">Business Name</label>
                    <input type="text" id="business_name" required name="business_name" placeholder="e.g., Skyrich Group" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-white focus:outline-none focus:border-purple-500 transition">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-400 mb-1">Product or Service Description</label>
                    <textarea id="product_service" required name="product_service" rows="3" placeholder="Describe what you are selling..." class="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-white focus:outline-none focus:border-purple-500 transition"></textarea>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-400 mb-1">Target Audience</label>
                    <input type="text" id="target_audience" required name="target_audience" placeholder="e.g., Small business owners, tech enthusiasts" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-white focus:outline-none focus:border-purple-500 transition">
                </div>

                <button type="submit" id="submitBtn" class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 rounded-lg shadow-lg hover:shadow-purple-500/20 transition duration-300 flex justify-center items-center gap-2">
                    <span>🔥 Generate AI Copy</span>
                    <div id="loader" class="hidden animate-spin rounded-full h-5 w-5 border-2 border-white border-t-transparent"></div>
                </button>
            </form>
        </div>

        <!-- Right Side: AI Results -->
        <div class="space-y-6">
            <h2 class="text-xl font-bold text-gray-400">✨ Your AI Copies</h2>
            
            <div id="placeholderText" class="bg-gray-950/50 border border-dashed border-gray-800 text-gray-500 p-10 rounded-2xl text-center">
                Fill the form and hit generate to see magic.
            </div>

            <!-- Output Cards CONTAINER (Hidden by default) -->
            <div id="outputContainer" class="hidden space-y-4">
                <!-- Google Headline -->
                <div class="bg-gray-950 p-5 rounded-xl border border-gray-800">
                    <span class="text-xs font-bold uppercase tracking-wider text-blue-400">🔍 Google Ad Headline</span>
                    <p id="res_google" class="mt-2 text-lg font-semibold text-white"></p>
                </div>

                <!-- Facebook Ad -->
                <div class="bg-gray-950 p-5 rounded-xl border border-gray-800">
                    <span class="text-xs font-bold uppercase tracking-wider text-blue-500">📘 Facebook Ad Copy</span>
                    <p id="res_facebook" class="mt-2 text-gray-300 whitespace-pre-line"></p>
                </div>

                <!-- Instagram Ad -->
                <div class="bg-gray-950 p-5 rounded-xl border border-gray-800">
                    <span class="text-xs font-bold uppercase tracking-wider text-pink-500">📸 Instagram Ad Caption</span>
                    <p id="res_instagram" class="mt-2 text-gray-300 whitespace-pre-line"></p>
                </div>

                <!-- CTA -->
                <div class="bg-gray-950 p-5 rounded-xl border border-purple-900/50 bg-gradient-to-r from-purple-950/20 to-transparent">
                    <span class="text-xs font-bold uppercase tracking-wider text-purple-400">⚡ Call To Action (CTA)</span>
                    <p id="res_cta" class="mt-2 text-xl font-bold text-purple-300"></p>
                </div>
            </div>
        </div>
    </main>

    <!-- JavaScript Handling Fetch Call -->
    <script>
        document.getElementById('adForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const loader = document.getElementById('loader');
            const placeholderText = document.getElementById('placeholderText');
            const outputContainer = document.getElementById('outputContainer');

            // Show Loader, Disable Button
            submitBtn.disabled = true;
            loader.classList.remove('hidden');

            // Prepare Data
            const formData = new FormData(this);

            try {
                // Hit our PHP backend
                const response = await fetch('generate.php', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if(data.error) {
                    alert('Error: ' + data.error);
                } else {
                    // Populate UI with Gemini Response
                    document.getElementById('res_google').innerText = data.google_headline || 'N/A';
                    document.getElementById('res_facebook').innerText = data.facebook_ad || 'N/A';
                    document.getElementById('res_instagram').innerText = data.instagram_ad || 'N/A';
                    document.getElementById('res_cta').innerText = data.cta || 'N/A';

                    // Toggle Views
                    placeholderText.classList.add('hidden');
                    outputContainer.classList.remove('hidden');
                }
            } catch (error) {
                console.error('Error fetching AI data:', error);
                alert('Something went wrong on the server!');
            } finally {
                // Hide Loader, Enable Button
                submitBtn.disabled = false;
                loader.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
